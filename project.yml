# XcodeGen spec. The .xcodeproj is generated and not committed:
#   xcodegen generate
name: Vivra

options:
  deploymentTarget:
    iOS: "26.0"
  developmentLanguage: en
  createIntermediateGroups: true
  groupSortPosition: top

configFiles:
  Debug: Config/Vivra.xcconfig
  Release: Config/Vivra.xcconfig

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    TARGETED_DEVICE_FAMILY: "1"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"

packages:
  VivraCore:
    path: Packages/VivraCore
  VivraStore:
    path: Packages/VivraStore

fileGroups:
  - Config
  - docs
  - project.yml

targets:
  Vivra:
    type: application
    platform: iOS
    sources:
      - App
    dependencies:
      - package: VivraCore
        product: VivraLogging
      - package: VivraStore
        product: VivraStore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(VIVRA_BUNDLE_ID)
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Vivra
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        ASSETCATALOG_COMPILER_APPICON_NAME: ""

  VivraTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - AppTests
    dependencies:
      - target: Vivra
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(VIVRA_BUNDLE_ID).tests
        GENERATE_INFOPLIST_FILE: YES

schemes:
  Vivra:
    build:
      targets:
        Vivra: all
    run:
      config: Debug
    test:
      config: Debug
      gatherCoverageData: true
      targets:
        - VivraTests
        - package: VivraCore/VivraLoggingTests
        - package: VivraStore/VivraStoreTests
