# XcodeGen spec. The .xcodeproj is generated and not committed:
#   xcodegen generate
name: Vivra

options:
  deploymentTarget:
    iOS: "26.0"
  developmentLanguage: en
  createIntermediateGroups: true
  groupSortPosition: top

configFiles:
  Debug: Config/Vivra.xcconfig
  Release: Config/Vivra.xcconfig

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    TARGETED_DEVICE_FAMILY: "1"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"

packages:
  VivraCore:
    path: Packages/VivraCore
  VivraStore:
    path: Packages/VivraStore
  HealthSync:
    path: Packages/HealthSync
  Narrative:
    path: Packages/Narrative

fileGroups:
  - Config
  - docs
  - project.yml

targets:
  Vivra:
    type: application
    platform: iOS
    sources:
      - App
      - Shared
    dependencies:
      - target: VivraWidgets
      - package: VivraCore
        product: VivraLogging
      - package: VivraCore
        product: VivraModel
      - package: VivraCore
        product: SyncCore
      - package: VivraCore
        product: InsightEngine
      - package: VivraCore
        product: NarrativeCore
      - package: VivraCore
        product: Gamification
      - package: VivraCore
        product: Norms
      - package: VivraStore
        product: VivraStore
      - package: HealthSync
        product: HealthSync
      - package: Narrative
        product: Narrative
      - sdk: HealthKit.framework
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(VIVRA_BUNDLE_ID)
        CODE_SIGN_ENTITLEMENTS: App/Vivra.entitlements
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Vivra
        INFOPLIST_KEY_NSHealthShareUsageDescription: >-
          Vivra reads your sleep, heart, activity, mood, nutrition and body data to show your trends and find
          patterns. Your data stays on this iPhone.
        INFOPLIST_KEY_NSHealthUpdateUsageDescription: >-
          If you turn it on in Settings, Vivra saves the mood and drinks you log to Apple Health so other apps can
          use them.
        INFOPLIST_KEY_NSFaceIDUsageDescription: Vivra uses Face ID to unlock the app when App Lock is on.
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        ASSETCATALOG_COMPILER_APPICON_NAME: ""

  VivraWidgets:
    type: app-extension
    platform: iOS
    sources:
      - Widgets
      - Shared
    info:
      path: Widgets/Info.plist
      properties:
        CFBundleDisplayName: Vivra
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(VIVRA_BUNDLE_ID).widgets
        SKIP_INSTALL: YES

  VivraTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - AppTests
    dependencies:
      - target: Vivra
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(VIVRA_BUNDLE_ID).tests
        GENERATE_INFOPLIST_FILE: YES

schemes:
  Vivra:
    build:
      targets:
        Vivra: all
    run:
      config: Debug
    test:
      config: Debug
      gatherCoverageData: true
      targets:
        - VivraTests
        - package: VivraCore/VivraLoggingTests
        - package: VivraCore/VivraModelTests
        - package: VivraCore/SyncCoreTests
        - package: VivraCore/InsightEngineTests
        - package: VivraCore/NarrativeCoreTests
        - package: VivraCore/GamificationTests
        - package: VivraCore/NormsTests
        - package: VivraStore/VivraStoreTests
        - package: HealthSync/HealthSyncTests
